name: Build APK dan Release

# Perbaikan dari run #1 yang gagal di langkah "Set up Android SDK":
# langkah android-actions/setup-android@v3 dihapus. Runner ubuntu-latest
# GitHub SUDAH membawa Android SDK bawaan (ANDROID_HOME), jadi tidak
# perlu action tambahan untuk memasangnya. Langkah install platform
# sekarang memakai sdkmanager dari SDK bawaan tersebut.
# By : Zhangxen
"on":
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install platform dan build-tools (SDK bawaan runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.5
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build APK debug
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Buat / perbarui Release v1.0 dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Teka-Teki v1.0"
          body: "APK game Teka-Teki Susun Angka untuk Android (debug, pemakaian pribadi). Unduh file .apk, pasang di HP, mainkan offline."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
